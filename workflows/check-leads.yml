name: Check Plumbing Leads

on:
  schedule:
    # Runs every 20 minutes. GitHub may delay this slightly under load - that's normal.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}  # lets you manually trigger a run from the Actions tab to test

permissions:
  contents: write  # needed so the workflow can commit the updated seen_posts.json

jobs:
  check-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run lead checker
        run: python check_leads.py

      - name: Save "seen" state back to repo
        run: |
          git config user.name "lead-bot"
          git config user.email "lead-bot@users.noreply.github.com"
          git add seen_posts.json
          git diff --staged --quiet || git commit -m "Update seen posts"
          git push
